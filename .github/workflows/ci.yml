name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: radiocalico
          POSTGRES_USER: radiocalico
          POSTGRES_PASSWORD: radiocalico
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U radiocalico"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run backend tests (SQLite)
        run: python -m pytest tests/test_app.py -v

      - name: Run backend tests (PostgreSQL)
        run: python -m pytest tests/test_app_postgres.py -v

      - name: Security scan (pip-audit)
        run: pip-audit -r requirements.txt

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test

      - name: Security scan (npm audit)
        run: npm audit
