server {
    listen 80;
    root /usr/share/nginx/html;

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/css application/javascript image/svg+xml;

    location = / {
        try_files /index.html =404;
    }

    # Images change rarely (only on a new deploy) -- safe to cache for a while.
    location ~* \.(png|jpg|jpeg|gif|svg|ico|webp)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=604800";
    }

    # CSS/JS aren't content-hashed, so a stale cached copy after a deploy
    # would silently keep serving old code -- always revalidate instead.
    location ~* \.(css|js)$ {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    location /api/ {
        proxy_pass http://app:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        return 404;
    }
}
