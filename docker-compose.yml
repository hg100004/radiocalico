services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-radiocalico}
      POSTGRES_USER: ${POSTGRES_USER:-radiocalico}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-radiocalico}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-radiocalico}"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"

  app:
    build: .
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-radiocalico}:${POSTGRES_PASSWORD:-radiocalico}@postgres:5432/${POSTGRES_DB:-radiocalico}
    depends_on:
      postgres:
        condition: service_healthy

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - app

volumes:
  pgdata:
